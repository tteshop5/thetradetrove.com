<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trove Beauty Co. | Beauty & Self-Care</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #faf8f4;
  color: #29231f;
}

.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 510px;
  margin: 25px auto;
  background: #e9dfd5;
  border-radius: 8px;
  overflow: hidden;
}

.hero-content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 55px;
}

.hero-content h1 {
  font-family: Georgia, serif;
  font-size: 54px;
  line-height: 1.1;
  margin: 15px 0;
}

.hero-content p {
  font-size: 16px;
  line-height: 1.8;
  color: #766e67;
}

.hero-content a {
  display: inline-block;
  width: fit-content;
  margin-top: 20px;
  padding: 15px 28px;
  background: #29231f;
  color: white;
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.hero img {
  width: 100%;
  height: 100%;
  min-height: 510px;
  object-fit: cover;
  object-position: center;
  display: block;
}

@media (max-width: 768px) {
  .hero {
    grid-template-columns: 1fr;
    min-height: auto;
    margin: 15px auto;
  }

  .hero-content {
    padding: 35px 25px;
  }

  .hero-content h1 {
    font-size: 40px;
  }

  .hero img {
    min-height: 350px;
    height: 350px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="hero-content">
    <p>WELCOME TO TROVE BEAUTY CO.</p>

    <h1>Your Everyday Beauty, Beautifully Found.</h1>

    <p>
      Discover makeup, hair care, beauty tools, self-care
      and everyday essentials designed to make your
      beauty routine feel special.
    </p>

    <a href="shop.html">Shop Collection</a>
  </div>

  <div class="hero-image">
    <img
      src="trove-hero.png"
      alt="Trove Beauty Co. pink blush beauty editorial"
    >
  </div>

</section>

</body>
</html>
