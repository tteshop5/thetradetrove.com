<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trove Beauty Co. | Beauty, Reimagined</title>

  <meta name="description" content="Explore makeup, beauty tools, hair care and everyday self-care essentials at Trove Beauty Co.">

  <meta name="theme-color" content="#f5f0e8">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap');

    :root {
      --cream: #f5f0e8;
      --paper: #fffdf9;
      --ink: #211b1b;
      --muted: #756c68;
      --plum: #512b3d;
      --rose: #b97983;
      --lime: #d9e66b;
      --line: #ded7ce;
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
      --page: 1320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    img {
      display: block;
      width: 100%;
      object-fit: cover;
    }

    .container {
      width: min(92%, var(--page));
      margin: 0 auto;
    }

    .announcement {
      background: var(--plum);
      color: white;
      text-align: center;
      padding: 9px 15px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* HEADER */

    .header {
      background: var(--cream);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(33, 27, 27, 0.1);
    }

    .header-inner {
      width: min(92%, var(--page));
      min-height: 84px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      font-family: var(--serif);
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -1.3px;
      white-space: nowrap;
    }

    .brand span {
      color: var(--rose);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav a {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav a:hover {
      color: var(--rose);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-actions a,
    .menu-toggle {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: 0;
      cursor: pointer;
      padding: 8px;
    }

    /* HERO */

    .hero {
      padding: 28px 0 75px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 0.88fr 1.12fr;
      min-height: 590px;
      background: var(--paper);
      overflow: hidden;
    }

    .hero-copy {
      padding: clamp(35px, 7vw, 95px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      position: relative;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 23px;
    }

    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(54px, 7vw, 98px);
      line-height: 0.98;
      font-weight: 500;
      letter-spacing: -4px;
      max-width: 570px;
    }

    .hero h1 em {
      color: var(--plum);
      font-weight: 400;
    }

    .hero-description {
      max-width: 360px;
      margin: 28px 0 34px;
      color: var(--muted);
      font-size: 14px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 27px;
      background: var(--plum);
      color: white;
      border: 1px solid var(--plum);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      transition: 0.25s ease;
    }

    .button:hover {
      background: transparent;
      color: var(--plum);
    }

    .button-light {
      background: var(--lime);
      border-color: var(--lime);
      color: var(--ink);
    }

    .button-light:hover {
      background: transparent;
      color: white;
      border-color: white;
    }

    .hero-image {
      position: relative;
      min-height: 590px;
      background: #c7a9a0;
    }

    .hero-image img {
      height: 100%;
      min-height: 590px;
      object-position: center 35%;
    }

    .hero-image-label {
      position: absolute;
      bottom: 25px;
      right: 25px;
      background: var(--lime);
      padding: 13px 18px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* MARQUEE */

    .marquee {
      background: var(--lime);
      overflow: hidden;
      white-space: nowrap;
      padding: 17px 0;
      color: var(--ink);
    }

    .marquee-track {
      display: flex;
      justify-content: space-around;
      gap: 30px;
      font-family: var(--serif);
      font-size: 20px;
      font-style: italic;
    }

    /* SECTION HEADINGS */

    .section {
      padding: 105px 0;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 25px;
      margin-bottom: 38px;
    }

    .section-heading h2 {
      font-family: var(--serif);
      font-size: clamp(38px, 5vw, 63px);
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -2px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 13px;
      max-width: 300px;
    }

    .text-link {
      display: inline-block;
      border-bottom: 1px solid currentColor;
      padding-bottom: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* CATEGORIES */

    .categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .category-card {
      position: relative;
      overflow: hidden;
      background: #d5c3b9;
      min-height: 430px;
    }

    .category-card img {
      height: 430px;
      transition: transform 0.6s ease;
    }

    .category-card:hover img {
      transform: scale(1.04);
    }

    .category-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 45%, rgba(22, 15, 17, 0.65));
      display: flex;
      flex-direction: column;
      justify-content: end;
      align-items: flex-start;
      padding: 30px;
      color: white;
    }

    .category-overlay small {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .category-overlay h3 {
      font-family: var(--serif);
      font-size: 37px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .category-overlay span {
      border-bottom: 1px solid white;
      padding-bottom: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* PRODUCT AREA */

    .products-section {
      background: var(--paper);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      min-width: 0;
    }

    .product-image {
      position: relative;
      background: #eee7df;
      overflow: hidden;
      aspect-ratio: 0.83;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.045);
    }

    .product-tag {
      position: absolute;
      top: 13px;
      left: 13px;
      background: var(--lime);
      padding: 6px 10px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .product-info {
      padding: 15px 2px 10px;
    }

    .product-info h3 {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      line-height: 1.3;
    }

    .product-info p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .product-price {
      margin-top: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .product-note {
      margin-top: 25px;
      color: var(--muted);
      font-size: 11px;
    }

    /* CAMPAIGN */

    .campaign {
      padding: 80px 0;
    }

    .campaign-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--plum);
      color: white;
      min-height: 500px;
    }

    .campaign-image {
      min-height: 500px;
    }

    .campaign-image img {
      height: 100%;
      min-height: 500px;
    }

    .campaign-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(35px, 7vw, 85px);
    }

    .campaign-copy .eyebrow {
      color: var(--lime);
    }

    .campaign-copy h2 {
      font-family: var(--serif);
      font-size: clamp(42px, 5vw, 68px);
      line-height: 1.02;
      font-weight: 500;
      letter-spacing: -2px;
    }

    .campaign-copy p {
      color: #e2d7dc;
      font-size: 13px;
      max-width: 360px;
      margin: 22px 0 30px;
    }

    /* BRAND STORY */

    .story {
      text-align: center;
      max-width: 850px;
      margin: auto;
      padding: 30px 20px;
    }

    .story .eyebrow {
      margin-bottom: 20px;
    }

    .story h2 {
      font-family: var(--serif);
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -2px;
    }

    .story h2 em {
      color: var(--rose
