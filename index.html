<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trove Beauty Co. | Beauty, Self-Care & Beauty Tools</title>

  <meta name="description"
    content="Discover makeup, hair care, beauty tools, self-care and everyday beauty essentials at Trove Beauty Co.">

  <meta name="keywords"
    content="Trove Beauty Co, makeup, beauty tools, hair care, self care, beauty essentials">

  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://website.thetradetrove.com/">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #fffaf7;
      color: #352b2b;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    .section {
      padding: 75px 0;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 38px;
    }

    .section-heading span {
      color: #a85e68;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: bold;
    }

    .section-heading h2 {
      font-size: clamp(28px, 4vw, 42px);
      margin: 8px 0;
    }

    .section-heading p {
      color: #806f6f;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .button {
      display: inline-block;
      padding: 13px 25px;
      background: #a85e68;
      color: white;
      border-radius: 30px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #a85e68;
      transition: .2s;
      cursor: pointer;
    }

    .button:hover {
      background: #874b55;
      border-color: #874b55;
      transform: translateY(-2px);
    }

    .button-outline {
      background: transparent;
      color: #874b55;
    }

    .button-outline:hover {
      color: white;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 250, 247, .98);
      border-bottom: 1px solid #eaded9;
      backdrop-filter: blur(10px);
    }

    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 190px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #e8b8bd;
      color: white;
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: bold;
    }

    .brand-text strong {
      display: block;
      font-size: 20px;
      letter-spacing: .4px;
    }

    .brand-text span {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #907878;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    nav a:hover {
      color: #a85e68;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border: 1px solid #dfceca;
      background: white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-button:hover {
      background: #f8e7e8;
    }

    .mobile-menu {
      display: none;
      border: 1px solid #dfceca;
      background: white;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .search-area {
      display: none;
      padding: 14px 0;
    }

    .search-area.active {
      display: block;
    }

    .search-box {
      display: flex;
      background: white;
      border: 1px solid #dfceca;
      border-radius: 30px;
      overflow: hidden;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 13px 18px;
    }

    .search-box button {
      border: none;
      background: #a85e68;
      color: white;
      padding: 0 22px;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      min-height: 570px;
      display: flex;
      align-items: center;
      background:
        linear-gradient(
          90deg,
          rgba(255,250,247,.98) 0%,
          rgba(255,250,247,.90) 43%,
          rgba(255,250,247,.25) 100%
        ),
        url("https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=1800&q=85")
        center/cover no-repeat;
    }

    .hero-content {
      padding: 80px 0;
      max-width: 620px;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      color: #a85e68;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .hero h1 {
      font-size: clamp(40px, 6vw, 68px);
      line-height: 1.08;
      margin-bottom: 20px;
      color: #352b2b;
    }

    .hero p {
      font-family: Arial, sans-serif;
      color: #6f5d5d;
      font-size: 15px;
      max-width: 490px;
      margin-bottom: 28px;
    }

    /* PROMO STRIP */

    .promo-strip {
      background: #f4e4e2;
      text-align: center;
      padding: 13px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: .5px;
      color: #71474d;
    }

    /* CATEGORIES */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .category-card {
      position: relative;
      min-height: 330px;
      border-radius: 12px;
      overflow: hidden;
      background: #f3e5e1;
    }

    .category-card img {
      height: 330px;
      transition: transform .4s;
    }

    .category-card:hover img {
      transform: scale(1.04);
    }

    .category-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        0deg,
        rgba(34, 23, 23, .72),
        transparent 70%
      );
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 25px;
      color: white;
    }

    .category-overlay h3 {
      font-size: 26px;
      margin-bottom: 7px;
    }

    .category-overlay a {
      font-family: Arial, sans-serif;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* PRODUCTS */

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .product-card {
      background: white;
      border: 1px solid #eee2de;
      border-radius: 12px;
      overflow: hidden;
      transition: .25s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(70, 40, 40, .08);
    }

    .product-card img {
      height: 245px;
      background: #f6eeeb;
    }

    .product-info {
      padding: 18px;
    }

    .product-info small {
      font-family: Arial, sans-serif;
      color: #a85e68;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-info h3 {
      font-size: 18px;
      margin: 7px 0;
    }

    .product-info p {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #806f6f;
      margin-bottom: 14px;
    }

    .product-link {
      display: inline-block;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #a85e68;
      font-weight: bold;
    }

    .product-link:hover {
      text-decoration: underline;
    }

    /* ABOUT */

    .about-section {
      background: #f5e9e6;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 55px;
    }

    .about-image img {
      height: 430px;
      border-radius: 12px;
    }

    .about-copy h2 {
      font-size: clamp(30px, 4vw, 43px);
      line-height: 1.15;
      margin-bottom: 18px;
    }

    .about-copy p {
      color: #756363;
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin-bottom: 17px;
    }
