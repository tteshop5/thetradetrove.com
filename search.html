
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search | Trove Beauty Co.</title>

<meta name="description" content="Search makeup, beauty tools, hair care and self-care products at Trove Beauty Co.">

<link rel="canonical" href="https://website.thetradetrove.com/search.html">

<style>

:root{
  --ink:#29231f;
  --paper:#faf8f4;
  --rose:#95685d;
  --line:#e7dfd6;
  --muted:#766e67;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

/* TOP BAR */

.topbar{
  background:var(--ink);
  color:white;
  text-align:center;
  padding:9px 15px;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* HEADER */

header{
  background:var(--paper);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1180px;
  margin:auto;
  padding:20px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  font-size:20px;
  font-weight:bold;
  letter-spacing:1.5px;
  white-space:nowrap;
}

.logo span{
  color:var(--rose);
}

nav{
  display:flex;
  align-items:center;
  gap:22px;
  flex-wrap:wrap;
}

nav a{
  font-size:11px;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

nav a:hover{
  color:var(--rose);
}

.bag-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:18px;
  padding:0 5px;
  margin-left:3px;
  border-radius:50%;
  background:var(--rose);
  color:white;
  font-size:10px;
}

/* HERO */

.hero{
  background:#eee5dc;
  text-align:center;
  padding:70px 20px;
}

.eyebrow{
  color:var(--rose);
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:12px;
}

.hero h1{
  margin:0 0 15px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:48px;
  font-weight:normal;
}

.hero p{
  max-width:620px;
  margin:auto;
  color:var(--muted);
  font-size:14px;
}

/* MAIN */

.main{
  max-width:1180px;
  margin:auto;
  padding:55px 5% 70px;
}

/* SEARCH */

.search-area{
  max-width:760px;
  margin:0 auto 30px;
}

.search-form{
  display:flex;
  background:white;
  border:1px solid var(--line);
}

.search-input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:16px;
  font-size:14px;
  color:var(--ink);
}

.search-button{
  border:0;
  background:var(--ink);
  color:white;
  padding:0 25px;
  cursor:pointer;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.search-button:hover{
  background:var(--rose);
}

/* FILTERS */

.filters{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:40px;
}

.filter{
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  padding:9px 15px;
  cursor:pointer;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.filter:hover,
.filter.active{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
}

/* RESULTS */

.results{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
  color:var(--muted);
  font-size:12px;
}

.results strong{
  color:var(--ink);
}

/* PRODUCT GRID */

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.product{
  background:white;
  border:1px solid var(--line);
  overflow:hidden;
}

.product-image{
  width:100%;
  height:320px;
  object-fit:cover;
  display:block;
  background:#eee5dc;
}

.product-info{
  padding:16px;
}

.source{
  color:var(--rose);
  font-size:9px;
  font-weight:bold;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.name{
  font-size:13px;
  font-weight:bold;
  line-height:1.4;
  margin-bottom:5px;
}

.category{
  color:var(--muted);
  font-size:11px;
  margin-bottom:10px;
}

.price{
  font-size:14px;
  font-weight:bold;
  margin-bottom:13px;
}

.add{
  width:100%;
  border:0;
  background:var(--ink);
  color:white;
  padding:12px 8px;
  cursor:pointer;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

.add:hover{
  background:var(--rose);
}

.add.done{
  background:var(--rose);
}

/* NO RESULTS */

.no-results{
  display:none;
  background:white;
  border:1px solid var(--line);
  padding:60px 20px;
  text-align:center;
}

.no-results h2{
  margin:0 0 10px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:28px;
  font-weight:normal;
}

.no-results p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

/* NOTE */

.note{
  background:#eee5dc;
  text-align:center;
  padding:55px 20px;
}

.note h2{
  margin:0 0 12px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:30px;
  font-weight:normal;
}

.note p{
  max-width:650px;
  margin:auto;
  color:var(--muted);
  font-size:13px;
}

/* FOOTER */

footer{
  background:var(--ink);
  color:white;
  text-align:center;
  padding:45px 20px;
}

.footer-logo{
  font-size:18px;
  font-weight:bold;
  letter-spacing:1.5px;
  margin-bottom:10px;
}

.footer
